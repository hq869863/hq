# ========== business (端口 8000) ==========
apiVersion: v1
kind: Service
metadata:
  name: business-service
spec:
  type: NodePort
  selector:
    app: business
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
---
# ========== ai (端口 8001) ==========
apiVersion: v1
kind: Service
metadata:
  name: ai-deployment
spec:
  type: ClusterIP
  selector:
    app: ai
  ports:
  - port: 8001
    targetPort: 8001
---
# ========== rag (端口 8009) ==========
apiVersion: v1
kind: Service
metadata:
  name: rag-deployment
spec:
  type: ClusterIP
  selector:
    app: rag
  ports:
  - port: 8009
    targetPort: 8009