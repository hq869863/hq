version: '3.8'
services:
  # 1. AI 模块
  aitest-ai:
    image: aitest-ai:1.0.0
    container_name: aitest-ai
    ports:
      - "8001:8001" # 假设 AI 模块对外暴露 8080 端口
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      - my-network
    depends_on:
      - redis
      - baidu-map-mcp

  # 2. Business 模块
  aitest-business:
    image: aitest-business:1.0.0
    container_name: aitest-business
    ports:
      - "8000:8000"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      - my-network
    depends_on:
      - redis

  # 3. rag 模块
  aitest-rag:
    image: aitest-rag:1.0.0
    container_name: aitest-rag
    ports:
      - "8009:8009"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      - my-network
    depends_on:
      - redis
  # 4. Redis 缓存
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    networks:
      - my-network

  # 5. 百度地图 MCP 服务
  baidu-map-mcp:
    image: baidu-map-mcp:2.0
    ports:
      - "3000:3000"
    environment:
      - BAIDU_MAP_API_KEY=87fbWzD4RNkTPtJTIqmtUGSHhEJ5QB9d
    command: mcp-server-baidu-map
    networks:
      - my-network

# 定义统一的内部网络
networks:
  my-network:
    driver: bridge