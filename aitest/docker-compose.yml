services:
  # 1. 主业务服务
  business-service:
    build: ./business
    ports:
      - "8000:8000"
    networks:
      - my-network
    depends_on:
      - redis

  # 2. AI 模块服务
  ai-service:
    build: ./ai
    ports:
      - "8001:8001"
    networks:
      - my-network
    depends_on:
      - redis
      - baidu-map-mcp

  # 3. RAG 模块服务
  rag-service:
    build: ./RAG
    ports:
      - "8009:8009"
    networks:
      - my-network
    depends_on:
      - redis

  # 4. Redis 缓存
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    networks:
      - my-network

  # 5. 百度地图 MCP 服务
  baidu-map-mcp:
    image: baidu-map-mcp:2.0
    ports:
      - "3000:3000"
    environment:
      - BAIDU_MAP_API_KEY=87fbWzD4RNkTPtJTIqmtUGSHhEJ5QB9d
    command: mcp-server-baidu-map
    networks:
      - my-network

# 定义统一的内部网络
networks:
  my-network:
    driver: bridge