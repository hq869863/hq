server:
  port: 8009

spring:
  application:
    name: RAG

  # 1. Redis 配置（既做消息队列，又做向量数据库）
  data:
    redis:
      host: redis
#      host: localhost
      port: 6379
      password: 123456
      database: 0

  # 2. Spring AI 向量数据库配置 (以 Redis 为例)
  ai:
    # 1. 配置 Embedding 模型
    dashscope:
      api-key: "sk-ws-H.ELPPPRD.RHOG.MEYCIQDhHMQVJ1vyhDjpovXpBx6YdTckJbhLxC27pniUxYX-WwIhAOQUBeAV_YA_MUjjqzLkT0dgmaEo8weonqzwfQaPCOL4"
      embedding:
        options:
          model: text-embedding-v1
    vectorstore:
      redis:
        uri: redis://default:123456@redis:6379
        initialize-schema: true
        prefix: "doc:"
        index-name: local-docs-index
