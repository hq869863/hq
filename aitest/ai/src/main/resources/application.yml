server:
  port: 8001
spring:
  application:
    name: ai
  data:
    redis:
      host: redis
      port: 6379
      password: 123456
  ai:
    vectorstore:
      redis:
        uri: redis://default:123456@redis:6379
        # 向量索引的名称
        index-name: local-docs-index
        # Redis 中存储向量数据的 Key 前缀
        prefix: "doc:"
    dashscope:
      api-key: "sk-ws-H.ELPPPRD.RHOG.MEYCIQDhHMQVJ1vyhDjpovXpBx6YdTckJbhLxC27pniUxYX-WwIhAOQUBeAV_YA_MUjjqzLkT0dgmaEo8weonqzwfQaPCOL4"
      chat:
        options:
          model: qwen-plus
      # 向量模型
      embedding:
        options:
          model: text-embedding-v1
    memory:
      redis:
        host: redis
        port: 6379
        password: 123456

