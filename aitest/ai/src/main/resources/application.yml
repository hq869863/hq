app:
  ai:
    # 默认系统提示词（可根据不同环境修改）
    default-system-prompt: "你是专业助手，必要时请调用工具"


    # 聊天记忆滑动窗口大小
    max-messages: 10
    baidu-map-url: 'https://mcp.map.baidu.com/mcp?ak=87fbWzD4RNkTPtJTIqmtUGSHhEJ5QB9d'
baidu:
  map:
    ak: "87fbWzD4RNkTPtJTIqmtUGSHhEJ5QB9d"
logging:
  level:
    org.springframework.ai: DEBUG
    com.alibaba.cloud.ai: DEBUG
    com.alibaba.dashscope: DEBUG
    # 1. 开启 Spring AI MCP 客户端的底层调试日志，查看连接和通信细节
    io.modelcontextprotocol.client: DEBUG

    # 2. 开启 Spring AI MCP 框架的自动配置和工具注册日志
    org.springframework.ai.mcp: DEBUG

    # 3. (可选) 开启 Spring AI 聊天客户端的日志，查看工具调用过程
    org.springframework.ai.chat.client.advisor: DEBUG