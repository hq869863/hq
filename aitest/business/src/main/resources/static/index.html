<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 登录面板样式 */
        .login-panel {
            width: 100%; max-width: 360px; padding: 32px;
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; gap: 16px;
        }
        .login-panel h2 { text-align: center; color: #333; margin-bottom: 8px; }
        .login-panel input {
            padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color 0.3s;
        }
        .login-panel input:focus { border-color: #007bff; }
        .login-panel button {
            padding: 12px; font-size: 14px; background-color: #007bff; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s;
        }
        .login-panel button:hover:not(:disabled) { background-color: #0056b3; }
        .login-panel button:disabled { background-color: #ccc; cursor: not-allowed; }
        .login-error { color: #c62828; font-size: 12px; text-align: center; display: none; }

        /* 聊天主容器（默认隐藏） */
        .chat-container {
            width: 100%; max-width: 800px; height: 90vh;
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: none; flex-direction: column; overflow: hidden;
        }
        /* 头部 */
        .chat-header {
            padding: 16px 24px; background: #fff;
            border-bottom: 1px solid #eee; font-size: 18px; font-weight: bold; color: #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-info { font-size: 12px; color: #666; }
        .logout-btn {
            font-size: 12px; color: #007bff; cursor: pointer; margin-left: 12px;
        }
        .logout-btn:hover { text-decoration: underline; }

        /* 消息展示区 */
        #messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 16px;
        }
        /* 消息气泡通用样式 */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-role { font-size: 12px; color: #999; margin-bottom: 4px; }
        .msg-content {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: #333; word-break: break-word;
        }
        /* 用户消息靠右 */
        .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.user .msg-content { background-color: #007bff; color: #fff; border-bottom-right-radius: 4px; }
        /* AI消息靠左 */
        .msg-wrapper.ai { align-self: flex-start; align-items: flex-start; }
        .msg-wrapper.ai .msg-content { background-color: #f4f4f4; border-bottom-left-radius: 4px; }
        /* 打字机光标动画 */
        .typing-cursor::after { content: '|'; animation: blink 1s step-end infinite; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 输入区 */
        .input-area {
            padding: 16px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fff;
        }
        #messageInput {
            flex: 1; padding: 12px; font-size: 14px;
            border: 1px solid #ddd; border-radius: 8px;
            resize: none; outline: none; transition: border-color 0.3s;
        }
        #messageInput:focus { border-color: #007bff; }
        #sendBtn {
            padding: 0 24px; font-size: 14px; background-color: #007bff; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s;
        }
        #sendBtn:hover:not(:disabled) { background-color: #0056b3; }
        #sendBtn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- 登录面板 -->
<div class="login-panel" id="loginPanel">
    <h2>AI 智能助手</h2>
    <input type="text" id="usernameInput" placeholder="请输入用户名" />
    <button id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="login-error" id="loginError"></div>
</div>

<!-- 聊天主容器 -->
<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        <span>AI 智能助手</span>
        <div>
            <span class="header-info" id="userInfo"></span>
            <span class="logout-btn" onclick="doLogout()">退出登录</span>
        </div>
    </div>
    <div id="messages">
        <div class="msg-wrapper ai">
            <div class="msg-role">AI 助手</div>
            <div class="msg-content">你好！我是你的智能助手，请问有什么可以帮您？</div>
        </div>
    </div>
    <div class="input-area">
        <textarea id="messageInput" rows="2" placeholder="输入你的问题..."></textarea>
        <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
</div>

<script>
    // ⚠️ 核心配置：根据你的后端实际地址修改
    const LOGIN_URL = "/login";
    const CHAT_URL = "/graph/default"; // 这里假设 chatId 传 "default"，或者你可以根据用户动态生成

    let currentToken = null;   // 存储登录后的 token
    let isStreaming = false;   // 是否正在流式输出中

    // ===================== 登录逻辑 =====================
    function doLogin() {
        const username = document.getElementById('usernameInput').value.trim();
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        if (!username) {
            loginError.textContent = "请输入用户名";
            loginError.style.display = "block";
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "登录中...";
        loginError.style.display = "none";

        // 调用后端 GET /login?user=xxx
        fetch(`${LOGIN_URL}?user=${encodeURIComponent(username)}`, { method: 'GET' })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                // 根据你的后端返回结构：{ message: "登录成功", token: "xxx" }
                if (data && data.token) {
                    currentToken = data.token;
                    // 切换 UI 到聊天界面
                    document.getElementById('loginPanel').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'flex';
                    document.getElementById('userInfo').textContent = `用户: ${username}`;
                    console.log("✅ 登录成功，Token:", currentToken);
                } else {
                    throw new Error("未获取到 Token");
                }
            })
            .catch(err => {
                console.error("❌ 登录失败:", err);
                loginError.textContent = "登录失败: " + err.message;
                loginError.style.display = "block";
            })
            .finally(() => {
                loginBtn.disabled = false;
                loginBtn.textContent = "登 录";
            });
    }

    // 退出登录
    function doLogout() {
        currentToken = null;
        document.getElementById('chatContainer').style.display = 'none';
        document.getElementById('loginPanel').style.display = 'flex';
        document.getElementById('usernameInput').value = '';
        document.getElementById('messages').innerHTML = `
            <div class="msg-wrapper ai">
                <div class="msg-role">AI 助手</div>
                <div class="msg-content">你好！我是你的智能助手，请问有什么可以帮您？</div>
            </div>
        `;
    }

    // ===================== 发送消息逻辑 =====================
    function sendMsg() {
        const input = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');
        const message = input.value.trim();

        if (!message || !currentToken || isStreaming) return;

        // 1. 渲染用户消息
        appendMessage('user', '我', message);
        input.value = '';
        btn.disabled = true;
        isStreaming = true;

        // 2. 渲染 AI 消息占位符（带闪烁光标）
        const aiContentDiv = appendMessage('ai', 'AI 助手', '');
        aiContentDiv.classList.add('typing-cursor');

        // 3. 构建 POST 请求，将 Token 放在请求头中
        fetch(CHAT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'satoken': currentToken   // ⚠️ Sa-Token 默认从请求头 satoken 中读取
            },
            body: message   // 直接发送用户输入的文本字符串
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`请求失败，状态码: ${response.status}`);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function readStream() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            aiContentDiv.classList.remove('typing-cursor');
                            btn.disabled = false;
                            isStreaming = false;
                            return;
                        }
                        buffer += decoder.decode(value, { stream: true });
                        // 按行分割，处理 SSE 格式 data: xxx
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // 保留最后一个不完整的片段
                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith('data:')) {
                                const content = trimmed.substring(5).trim();
                                if (content) {
                                    aiContentDiv.innerHTML += content.replace(/\n/g, '<br>');
                                    scrollToBottom();
                                }
                            } else if (trimmed) {
                                // 非 SSE 格式的纯文本流，直接追加
                                aiContentDiv.innerHTML += trimmed.replace(/\n/g, '<br>');
                                scrollToBottom();
                            }
                        }
                        return readStream();
                    });
                }
                return readStream();
            })
            .catch(err => {
                console.error("❌ 请求失败:", err);
                aiContentDiv.classList.remove('typing-cursor');
                aiContentDiv.innerHTML += `<br><span style="color:red;">[请求失败: ${err.message}]</span>`;
                btn.disabled = false;
                isStreaming = false;
            });
    }

    // 辅助方法：追加消息
    function appendMessage(type, role, content) {
        const messagesDiv = document.getElementById('messages');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${type}`;
        wrapper.innerHTML = `<div class="msg-role">${role}</div><div class="msg-content">${content}</div>`;
        messagesDiv.appendChild(wrapper);
        scrollToBottom();
        return wrapper.querySelector('.msg-content');
    }

    // 辅助方法：自动滚动到底部
    function scrollToBottom() {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 支持回车发送（Shift+Enter 换行）
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
        }
    });

    // 支持在登录输入框按回车登录
    document.getElementById('usernameInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            doLogin();
        }
    });
</script>
</body>
</html>
