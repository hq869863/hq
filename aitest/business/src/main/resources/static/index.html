<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 聊天主容器 */
        .chat-container {
            width: 100%; max-width: 800px; height: 90vh;
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* 头部 */
        .chat-header {
            padding: 16px 24px; background: #fff;
            border-bottom: 1px solid #eee; font-size: 18px; font-weight: bold; color: #333;
        }
        /* 消息展示区 */
        #messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 16px;
        }
        /* 消息气泡通用样式 */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-role { font-size: 12px; color: #999; margin-bottom: 4px; }
        .msg-content {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: #333; word-break: break-word;
        }
        /* 用户消息靠右 */
        .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.user .msg-content { background-color: #007bff; color: #fff; border-bottom-right-radius: 4px; }
        /* AI消息靠左 */
        .msg-wrapper.ai { align-self: flex-start; align-items: flex-start; }
        .msg-wrapper.ai .msg-content { background-color: #f4f4f4; border-bottom-left-radius: 4px; }
        /* 打字机光标动画 */
        .typing-cursor::after { content: '|'; animation: blink 1s step-end infinite; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 输入区 */
        .input-area {
            padding: 16px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fff;
        }
        #messageInput {
            flex: 1; padding: 12px; font-size: 14px;
            border: 1px solid #ddd; border-radius: 8px;
            resize: none; outline: none; transition: border-color 0.3s;
        }
        #messageInput:focus { border-color: #007bff; }
        button {
            padding: 0 24px; font-size: 14px; background-color: #007bff; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s;
        }
        button:hover:not(:disabled) { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">AI 智能助手</div>
    <div id="messages">
        <!-- 默认欢迎消息 -->
        <div class="msg-wrapper ai">
            <div class="msg-role">AI 助手</div>
            <div class="msg-content">你好！我是你的智能助手，请问有什么可以帮您？</div>
        </div>
    </div>
    <div class="input-area">
        <textarea id="messageInput" rows="2" placeholder="输入你的问题..."></textarea>
        <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
</div>

<script>
    // ⚠️ 核心配置：填入你登录成功后获取的 Token
    const SA_TOKEN = "你的Sa-Token值";
    let currentEventSource = null;

    function sendMsg() {
        const input = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');
        const message = input.value.trim();

        if (!message || currentEventSource) return;

        // 1. 渲染用户消息
        appendMessage('user', '我', message);
        input.value = '';
        btn.disabled = true;

        // 2. 渲染 AI 消息占位符（带闪烁光标）
        const aiContentDiv = appendMessage('ai', 'AI 助手', '');
        aiContentDiv.classList.add('typing-cursor');

        // 3. 构建带 Token 的 SSE 请求 URL
        const url = `/chat?msg=${encodeURIComponent(message)}&satoken=${SA_TOKEN}`;
        currentEventSource = new EventSource(url);

        // 4. 监听流式数据
        currentEventSource.onmessage = function (event) {
            const data = event.data;
            aiContentDiv.innerHTML += data.replace(/\n/g, '<br>');
            scrollToBottom();
        };

        // 5. 监听结束/错误
        currentEventSource.onerror = function () {
            currentEventSource.close();
            currentEventSource = null;
            btn.disabled = false;
            aiContentDiv.classList.remove('typing-cursor'); // 移除闪烁光标
        };
    }

    // 辅助方法：追加消息
    function appendMessage(type, role, content) {
        const messagesDiv = document.getElementById('messages');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${type}`;
        wrapper.innerHTML = `<div class="msg-role">${role}</div><div class="msg-content">${content}</div>`;
        messagesDiv.appendChild(wrapper);
        scrollToBottom();
        return wrapper.querySelector('.msg-content');
    }

    // 辅助方法：自动滚动到底部
    function scrollToBottom() {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>
</body>
</html>
