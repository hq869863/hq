<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 聊天主容器 */
        .chat-container {
            width: 100%; max-width: 800px; height: 90vh;
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* 头部 */
        .chat-header {
            padding: 16px 24px; background: #fff;
            border-bottom: 1px solid #eee; font-size: 18px; font-weight: bold; color: #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-status {
            font-size: 12px; font-weight: normal; padding: 4px 10px;
            border-radius: 12px;
        }
        .header-status.login { background: #e8f5e9; color: #2e7d32; }
        .header-status.waiting { background: #fff3e0; color: #e65100; }
        .header-status.error { background: #ffebee; color: #c62828; }
        /* 消息展示区 */
        #messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 16px;
        }
        /* 消息气泡通用样式 */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-role { font-size: 12px; color: #999; margin-bottom: 4px; }
        .msg-content {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: #333; word-break: break-word;
        }
        /* 用户消息靠右 */
        .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.user .msg-content { background-color: #007bff; color: #fff; border-bottom-right-radius: 4px; }
        /* AI消息靠左 */
        .msg-wrapper.ai { align-self: flex-start; align-items: flex-start; }
        .msg-wrapper.ai .msg-content { background-color: #f4f4f4; border-bottom-left-radius: 4px; }
        /* 打字机光标动画 */
        .typing-cursor::after { content: '|'; animation: blink 1s step-end infinite; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 输入区 */
        .input-area {
            padding: 16px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fff;
        }
        #messageInput {
            flex: 1; padding: 12px; font-size: 14px;
            border: 1px solid #ddd; border-radius: 8px;
            resize: none; outline: none; transition: border-color 0.3s;
        }
        #messageInput:focus { border-color: #007bff; }
        button {
            padding: 0 24px; font-size: 14px; background-color: #007bff; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s;
        }
        button:hover:not(:disabled) { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <span>AI 智能助手</span>
        <span id="loginStatus" class="header-status waiting">登录中...</span>
    </div>
    <div id="messages">
        <!-- 默认欢迎消息 -->
        <div class="msg-wrapper ai">
            <div class="msg-role">AI 助手</div>
            <div class="msg-content">你好！我是你的智能助手，请问有什么可以帮您？</div>
        </div>
    </div>
    <div class="input-area">
        <textarea id="messageInput" rows="2" placeholder="输入你的问题..."></textarea>
        <button id="sendBtn" onclick="sendMsg()" disabled>发送</button>
    </div>
</div>

<script>
    // ⚠️ 核心配置：登录接口地址（根据你的后端实际地址修改）
    const LOGIN_URL = "/login";
    // ⚠️ 聊天接口基础路径
    const CHAT_BASE_URL = "/graph";

    let chatId = null;       // 登录后获取的 token，作为 chatId
    let currentEventSource = null;

    // ===================== 页面加载时自动登录 =====================
    window.addEventListener('DOMContentLoaded', async () => {
        const statusEl = document.getElementById('loginStatus');
        const sendBtn = document.getElementById('sendBtn');

        try {
            const res = await fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // ⚠️ 根据你的登录接口要求，修改这里的请求体
                body: JSON.stringify({
                    username: "test",
                    password: "123456"
                })
            });

            if (!res.ok) {
                throw new Error(`登录失败，状态码: ${res.status}`);
            }

            const data = await res.json();

            // ⚠️ 根据你的登录接口返回结构，修改这里的取值字段
            // 常见返回结构：{ token: "xxx" } 或 { data: { token: "xxx" } } 或 { satoken: "xxx" }
            chatId = data.token || data.satoken || data.data?.token || data.access_token;

            if (!chatId) {
                throw new Error("登录成功但未获取到 token，请检查返回数据结构");
            }

            // 登录成功，更新 UI
            statusEl.textContent = "已登录";
            statusEl.className = "header-status login";
            sendBtn.disabled = false;

            console.log("✅ 自动登录成功，chatId =", chatId);
        } catch (err) {
            console.error("❌ 自动登录失败:", err);
            statusEl.textContent = "登录失败";
            statusEl.className = "header-status error";
            appendMessage('ai', '系统', '自动登录失败，请检查后端接口是否可用。错误: ' + err.message);
        }
    });

    // ===================== 发送消息 =====================
    function sendMsg() {
        const input = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');
        const message = input.value.trim();

        if (!message || !chatId || currentEventSource) return;

        // 1. 渲染用户消息
        appendMessage('user', '我', message);
        input.value = '';
        btn.disabled = true;

        // 2. 渲染 AI 消息占位符（带闪烁光标）
        const aiContentDiv = appendMessage('ai', 'AI 助手', '');
        aiContentDiv.classList.add('typing-cursor');

        // 3. 构建 SSE 请求 URL，将 token 作为 chatId 拼在路径中
        const url = `${CHAT_BASE_URL}/${encodeURIComponent(chatId)}`;

        // 4. 使用 fetch + ReadableStream 实现 POST + SSE
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: message   // 直接发送用户输入的文本
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`请求失败，状态码: ${response.status}`);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function readStream() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            aiContentDiv.classList.remove('typing-cursor');
                            btn.disabled = false;
                            currentEventSource = null;
                            return;
                        }
                        buffer += decoder.decode(value, { stream: true });
                        // 按行分割，处理 SSE 格式 data: xxx
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // 保留最后一个不完整的片段
                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith('data:')) {
                                const content = trimmed.substring(5).trim();
                                if (content) {
                                    aiContentDiv.innerHTML += content.replace(/\n/g, '<br>');
                                    scrollToBottom();
                                }
                            } else if (trimmed) {
                                // 非 SSE 格式的纯文本流，直接追加
                                aiContentDiv.innerHTML += trimmed.replace(/\n/g, '<br>');
                                scrollToBottom();
                            }
                        }
                        return readStream();
                    });
                }
                return readStream();
            })
            .catch(err => {
                console.error("❌ 请求失败:", err);
                aiContentDiv.classList.remove('typing-cursor');
                aiContentDiv.innerHTML += `<br><span style="color:red;">[请求失败: ${err.message}]</span>`;
                btn.disabled = false;
                currentEventSource = null;
            });
    }

    // 辅助方法：追加消息
    function appendMessage(type, role, content) {
        const messagesDiv = document.getElementById('messages');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${type}`;
        wrapper.innerHTML = `<div class="msg-role">${role}</div><div class="msg-content">${content}</div>`;
        messagesDiv.appendChild(wrapper);
        scrollToBottom();
        return wrapper.querySelector('.msg-content');
    }

    // 辅助方法：自动滚动到底部
    function scrollToBottom() {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 支持回车发送（Shift+Enter 换行）
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
        }
    });
</script>
</body>
</html>
